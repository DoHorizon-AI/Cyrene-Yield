name: ci

on:
  push:
    branches: [main, develop, chore/*, feat/*, fix/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-unit:
    name: ci / training-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv==0.12.3
          uv sync --locked --extra dev
          uv run --no-sync ruff check training/core/src training/core/tests sdk/python/cyrene_yield_contracts/src
          uv run --no-sync ruff format --check training/core/tests/conftest.py scripts/project_artifact_ref_schema.py scripts/generate_kernel_descriptor.py contracts/product/v1/tests/test_contract.py
          uv run --no-sync mypy
      - name: Enforce Plugin implementation ownership
        run: |
          test ! -d training/core/src/cy_exec/training/engines/native_transformers
          test ! -e training/core/src/cy_exec/training/reference_preflight.py
          if rg -n '^(from|import) (torch|transformers)(\.| |$)' training/core/src; then
            echo 'Concrete training and model-analysis implementations belong in Cyrene-Plugins-Official.' >&2
            exit 1
          fi
      - name: Run training core unit tests
        run: |
          uv run --no-sync pytest training/core/tests/
