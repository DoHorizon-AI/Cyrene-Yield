name: ci

on:
  push:
    branches: [main, develop, chore/*, feat/*, fix/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-unit:
    name: ci / training-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv==0.12.3
          uv sync --locked --extra dev
          uv run --no-sync ruff check training/core/src training/core/tests sdk/python/cyrene_yield_contracts/src
          uv run --no-sync ruff format --check training/core/tests/conftest.py scripts/project_artifact_ref_schema.py scripts/generate_kernel_descriptor.py contracts/product/v1/tests/test_contract.py
          uv run --no-sync mypy
      - name: Enforce Plugin implementation ownership
        run: |
          test ! -d training/core/src/cy_exec/training/engines/native_transformers
          test ! -e training/core/src/cy_exec/training/reference_preflight.py
          if rg -n '^(from|import) (torch|transformers)(\.| |$)' training/core/src; then
            echo 'Concrete training and model-analysis implementations belong in Cyrene-Plugins-Official.' >&2
            exit 1
          fi
      - name: Run training core unit tests
        run: |
          uv run --no-sync pytest training/core/tests/

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [training-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked packaging tool
        run: python -m pip install --disable-pip-version-check uv==0.12.3
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-yield-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Yield-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-yield-${GITHUB_SHA}.source.tar.gz"
          uv build --wheel --out-dir dist .
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-yield-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
