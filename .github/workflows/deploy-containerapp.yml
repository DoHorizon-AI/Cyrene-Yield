name: cd-containerapp

on:
  push:
    branches: [main, release, develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: cd / build, push & deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AZURE_RESOURCE_GROUP: Container-APP
      AZURE_APP_NAME: cyrene-yield
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI: ${{ vars.YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI }}
      YIELD_WORKSPACE_AUTH_IDENTITY: ${{ vars.YIELD_WORKSPACE_AUTH_IDENTITY }}

    steps:
      - name: Require Azure OIDC configuration
        run: |
          for variable in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!variable}" ]; then
              echo "$variable is required for ACA deployment" >&2
              exit 1
            fi
          done

      - name: Validate optional Yield auth reference
        shell: bash
        run: |
          if [[ -z "$YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI" && -z "$YIELD_WORKSPACE_AUTH_IDENTITY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Yield Workspace auth reference is not configured; leaving ACA auth settings unchanged."
            exit 0
          fi
          if [[ -z "$YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI" || -z "$YIELD_WORKSPACE_AUTH_IDENTITY" ]]; then
            echo "Yield Workspace map URI and managed identity must be configured together." >&2
            exit 1
          fi

          if [[ ! "$YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI" =~ ^https://([A-Za-z0-9-]+)\.vault\.azure\.net/secrets/([A-Za-z0-9-]+)$ ]]; then
            echo "YIELD_WORKSPACE_CREDENTIAL_MAP_SECRET_URI must be a versionless Azure Key Vault secret URI." >&2
            exit 1
          fi
          echo "vault_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "secret_name=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

          if [[ "$YIELD_WORKSPACE_AUTH_IDENTITY" != "system" && ! "$YIELD_WORKSPACE_AUTH_IDENTITY" =~ ^/subscriptions/[^[:space:]/]+/resourceGroups/[^[:space:]/]+/providers/Microsoft\.ManagedIdentity/userAssignedIdentities/[^[:space:]/]+$ ]]; then
            echo "YIELD_WORKSPACE_AUTH_IDENTITY must be 'system' or a managed identity resource ID." >&2
            exit 1
          fi

          echo "Automated Yield auth promotion is disabled: ACA updates have no documented conditional ETag guard, so an update could overwrite a newer revision. Use the reviewed manual deployment procedure in docs/operations/ACA_WORKSPACE_SERVICE_AUTH.md." >&2
          exit 1

      - name: Checkout Cyrene-Yield
        uses: actions/checkout@v5
        with:
          path: Cyrene-Services/Cyrene-Yield

      - name: Fetch sibling repositories (Cyrene-Platform & Cyrene-Plugins-Official)
        run: |
          TARGET_BRANCH="${GITHUB_REF_NAME:-develop}"
          for name in Cyrene-Platform Cyrene-Plugins-Official; do
            echo "Fetching $name (target branch: $TARGET_BRANCH)..."
            git clone --quiet --depth 1 --branch "$TARGET_BRANCH" "https://github.com/DoHorizon-AI/$name.git" "$name" 2>/dev/null || \
            git clone --quiet --depth 1 --branch develop "https://github.com/DoHorizon-AI/$name.git" "$name" 2>/dev/null || \
            git clone --quiet --depth 1 "https://github.com/DoHorizon-AI/$name.git" "$name"
          done

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Publish a repository-owned package; the older package lacks Actions access.
          IMAGE="ghcr.io/${REPO_OWNER}/cyrene-yield-aca"
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cyrene-Services/Cyrene-Yield/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Require internal ACA ingress before changes
        shell: bash
        run: |
          ingress_external=$(az containerapp show \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.external" \
            --output tsv)
          if [[ "$ingress_external" != "false" ]]; then
            echo "Refusing ACA update because Yield ingress is not confirmed internal." >&2
            exit 1
          fi

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.meta.outputs.full_image }}" \
            --only-show-errors \
            --output none

      - name: Verify healthy internal revision
        run: |
          for i in {1..60}; do
            INGRESS_EXTERNAL=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.external" -o tsv)
            if [ "$INGRESS_EXTERNAL" != "false" ]; then
              echo "Yield ingress is not internal" >&2
              exit 1
            fi
            REVISION=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.latestRevisionName" -o tsv)
            READY=$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.latestReadyRevisionName" -o tsv)
            if [ -n "$REVISION" ] && [ "$REVISION" = "$READY" ]; then
              HEALTH=$(az containerapp revision show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$REVISION" --query "properties.healthState" -o tsv)
              IMAGE=$(az containerapp revision show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$REVISION" --query "properties.template.containers[0].image" -o tsv)
              if [ "$HEALTH" = "Healthy" ] && [ "$IMAGE" = "${{ steps.meta.outputs.full_image }}" ]; then
                echo "Healthy internal revision: $REVISION ($IMAGE)"
                exit 0
              fi
            fi
            echo "Waiting for healthy revision with image ${{ steps.meta.outputs.full_image }} ($i/60)"
            sleep 3
          done
          echo "Yield revision did not become healthy with the expected image" >&2
          exit 1
