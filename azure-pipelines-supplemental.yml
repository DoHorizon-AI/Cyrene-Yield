# Hosted Product checks for Cyrene-Yield.
# 托管产品定向检查；真实 GPU 和完整生命周期验收由独立验证执行。
name: $(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: githubServiceConnection
  type: string
  default: DoHorizon-AI
- name: platformRef
  type: string
  default: c59be6f2bd82489fbe933dadff84fc589e00afd9
- name: runGpuSmoke
  displayName: 'Run Real CUDA Deployment Smoke (Requires Self-Hosted GPU Pool)'
  type: boolean
  default: false
- name: gpuPoolName
  displayName: 'Self-Hosted GPU Agent Pool Name'
  type: string
  default: 'Default'

# Yield targets public source distribution: GitHub Actions owns automatic source
# and contract checks. The live GitHub repository remains private until an owner
# changes visibility. Keep Azure manual for self-hosted GPU/runtime acceptance
# and delivery work.
trigger: none
pr: none

resources:
  repositories:
  - repository: platform
    type: github
    name: DoHorizon-AI/Cyrene-Platform
    endpoint: ${{ parameters.githubServiceConnection }}
    ref: ${{ parameters.platformRef }}

pool:
  vmImage: ubuntu-latest

jobs:
- job: yield_clean_core
  displayName: 'Yield / Clean-Room Contract & Training Suite'
  timeoutInMinutes: 20
  variables:
    UV_CACHE_DIR: '$(Pipeline.Workspace)/.cache/uv'
  steps:
  - checkout: self
    path: s/Cyrene-Yield
    persistCredentials: true
    displayName: 'Checkout repository'

  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | "$(Build.Repository.Name)" | Cyrene-Yield/uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)" | "$(Build.Repository.Name)"
      path: '$(Pipeline.Workspace)/.cache/uv'
    displayName: 'Restore uv dependency cache'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Setup Python 3.12'

  - bash: |
      set -euo pipefail
      python -m pip install uv==0.12.3
      uv sync --locked --extra dev
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Yield
    displayName: Install locked dependencies and exact Platform/Plugins SDKs

  - bash: |
      set -euo pipefail
      uv run --no-sync ruff check training/core/src training/core/tests sdk/python/cyrene_yield_contracts/src
      uv run --no-sync ruff check --select E,F,I,UP training/core/src/cy_exec/training/product_*.py training/core/src/cy_exec/training/executors/kernel_rpc.py training/core/src/cy_exec/training/executors/kernel_training.py training/core/src/cy_exec/training/executors/training_worker.py
      uv run --no-sync ruff format --check training/core/tests/conftest.py scripts/project_artifact_ref_schema.py scripts/generate_kernel_descriptor.py contracts/product/v1/tests/test_contract.py
      uv run --no-sync mypy
      uv run --no-sync pytest -q training/core/tests trainer-runtime/tests contracts/product/v1/tests --junitxml=test-results.xml
      uv run --no-sync python - <<'PY'
      from pathlib import Path
      from openapi_spec_validator import validate
      from openapi_spec_validator.readers import read_from_filename
      for path in Path("contracts/product/v1").glob("*openapi.yaml"):
          document, base = read_from_filename(str(path.resolve()))
          validate(document, base_uri=base)
          print("Validated", path.name)
      PY
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Yield
    displayName: Product lint, type, unit, contract and OpenAPI checks

  - bash: |
      set -euo pipefail
      uv lock --project trainer-runtime --check
      uv run --no-sync ruff check trainer-runtime training/core/tests/test_product_runtime_config.py
      python -m py_compile trainer-runtime/bootstrap.py trainer-runtime/probe.py
    workingDirectory: $(Pipeline.Workspace)/s/Cyrene-Yield
    displayName: Validate locked trainer runtime bootstrap

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '$(Pipeline.Workspace)/s/Cyrene-Yield/test-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

- ${{ if eq(parameters.runGpuSmoke, true) }}:
  - job: yield_cuda_smoke
    displayName: 'Yield / Self-Hosted RTX 4080 CUDA Smoke'
    dependsOn: yield_clean_core
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: ${{ parameters.gpuPoolName }}
      demands:
      - cyrene.gpu -equals rtx4080
    timeoutInMinutes: 90
    steps:
    - checkout: self
      path: s/Cyrene-Yield
      displayName: 'Checkout repository'

    - checkout: platform
      path: s/Cyrene-Platform
      displayName: 'Checkout Platform'

    - bash: |
        set -euo pipefail
        case "$(Build.SourceBranch)" in
          refs/heads/develop|refs/heads/main) ;;
          *) echo 'GPU runtime is restricted to canonical branches.' >&2; exit 1 ;;
        esac
        platform_home="$(Agent.TempDirectory)/cyrene-yield-runtime/platform"
        trainer_home="$(Agent.TempDirectory)/cyrene-yield-runtime/trainer"
        "$(Pipeline.Workspace)/s/Cyrene-Platform/tooling/runtime/cyrene-runtime" down \
          --runtime-home "$platform_home" >/dev/null || true
        "$(Pipeline.Workspace)/s/Cyrene-Platform/tooling/runtime/cyrene-runtime" up \
          --runtime-home "$platform_home"
        "$(Pipeline.Workspace)/s/Cyrene-Yield/trainer-runtime/cyrene-trainer-runtime" bootstrap \
          --runtime-home "$trainer_home"
        "$(Pipeline.Workspace)/s/Cyrene-Yield/trainer-runtime/cyrene-trainer-runtime" status \
          --runtime-home "$trainer_home"
      displayName: 'Bootstrap Kernel and locked trainer runtime'

    - bash: |
        set -euo pipefail
        "$(Pipeline.Workspace)/s/Cyrene-Platform/tooling/runtime/cyrene-runtime" down \
          --runtime-home "$(Agent.TempDirectory)/cyrene-yield-runtime/platform"
      condition: always()
      displayName: 'Teardown owned runtime processes'

- job: publish_evidence
  displayName: 'Yield / Assemble Evidence'
  dependsOn:
  - yield_clean_core
  condition: succeeded()
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: |
      mkdir -p ci/evidence
      cat <<EOT > ci/evidence/summary.json
      {
        "suite": "Cyrene-Yield-Baseline",
        "commit": "$(Build.SourceVersion)",
        "pipeline": "$(Build.DefinitionName)",
        "build_id": "$(Build.BuildId)",
        "result": "CLEAN_CORE_PASS",
        "hosted_gpu": "NOT_RUN",
        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      }
      EOT
    displayName: 'Generate Evidence Ledger'

  - publish: ci/evidence
    artifact: yield-evidence
    displayName: 'Publish Yield Evidence'
