openapi: 3.1.2
info:
  title: Cyrene Yield Workspace Private Product API
  version: 1.0.0
  description: >-
    Private service-to-service routes used by the Workspace Product projection.
    A configured bearer resolves to a fixed organization and Workspace on the
    Product server. The bearer authenticates the Platform service only; it
    carries no user, member, or role identity.
paths:
  /internal/workspace/v1/training-drafts:
    post:
      operationId: workspaceCreateTrainingDraft
      summary: Create a scoped Yield-owned TrainingDraft
      description: >-
        Product assigns the authenticated organization and Workspace scope;
        caller-supplied workspace fields are ignored. Resource, scope provenance,
        and idempotency receipt are committed in one ProductStore transaction.
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/CreateTrainingDraft
      responses:
        '201':
          description: Scoped Product-owned TrainingDraft created or replayed
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/TrainingDraft
        '401':
          description: Workspace service bearer is missing or invalid
        '409':
          description: Idempotency key conflicts with a different request
        '422':
          description: Draft request is invalid
        '503':
          description: Workspace service credential is not configured
  /internal/workspace/v1/training-drafts/actions/import-llama-factory:
    post:
      operationId: workspaceImportLlamaFactory
      summary: Create a scoped draft from an admitted LLaMA Factory YAML subset
      description: Product assigns scope from the authenticated service credential.
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, datasetVersion, yaml]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                datasetVersion:
                  $ref: ./openapi.yaml#/components/schemas/DatasetVersionRef
                yaml:
                  type: string
                  minLength: 1
                  maxLength: 1000000
      responses:
        '201':
          description: Scoped Product-owned TrainingDraft created or replayed
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/TrainingDraft
        '400':
          description: YAML contains a field or value outside the admitted subset
        '401':
          description: Workspace service bearer is missing or invalid
        '409':
          description: Idempotency key conflicts with a different request
        '422':
          description: Draft request is invalid
        '503':
          description: Workspace service credential is not configured
  /internal/workspace/v1/training-drafts/{draft_id}:
    get:
      operationId: workspaceGetDraft
      summary: Read one scoped Yield-owned TrainingDraft
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Current Product-owned TrainingDraft projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTrainingDraftProjection'
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingDraft does not exist in the authenticated scope
        '503':
          description: Workspace service credential is not configured
    patch:
      operationId: workspacePrepareDraft
      summary: Prepare a scoped TrainingDraft
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/PrepareTrainingDraft
      responses:
        '200':
          description: Scoped draft updated by its Product owner
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/TrainingDraft
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingDraft does not exist in the authenticated scope
        '422':
          description: Preparation request or referenced Artifact is invalid
        '503':
          description: Workspace service credential is not configured
  /internal/workspace/v1/training-drafts/{draft_id}/actions/start:
    post:
      operationId: workspaceStartRun
      summary: Start the Yield-owned run for a scoped TrainingDraft
      description: >-
        Preserves the existing 202 Product response. The optional request key
        supports Authority retry deduplication; Yield also guarantees one run
        per draft using its stable ProductDraft identity.
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Product accepted the run start request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTrainingRunProjection'
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingDraft does not exist in the authenticated scope
        '422':
          description: Draft is not prepared or the Product operation is invalid
        '503':
          description: Workspace service credential or execution is unavailable
  /internal/workspace/v1/training-runs/{run_id}:
    get:
      operationId: workspaceGetRun
      summary: Read one Yield-owned run in the authenticated Workspace scope
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current scoped run projection with verified scope identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceScopedTrainingRunProjection'
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingRun does not exist in the authenticated scope
        '503':
          description: Workspace service credential is not configured
  /internal/workspace/v1/training-runs/{run_id}/events/query:
    post:
      operationId: workspaceListRunEvents
      summary: Read one bounded event page for a scoped Yield training run
      description: >-
        Uses a JSON cursor request so the Workspace unary invocation can carry
        afterSequence and limit without adding query transport support.
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceTrainingEventsQuery'
      responses:
        '200':
          description: Bounded, run-bound event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTrainingEventsPageProjection'
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingRun does not exist in the authenticated scope
        '422':
          description: Event cursor or page size is invalid
        '503':
          description: Workspace service credential is not configured
  /internal/workspace/v1/training-runs/{run_id}/attempts:
    get:
      operationId: workspaceListRunAttempts
      summary: Read sanitized phase summaries for a scoped Yield training run
      security:
        - WorkspaceServiceBearer: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Sanitized attempts bound to the requested run and Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTrainingAttemptsProjection'
        '401':
          description: Workspace service bearer is missing or invalid
        '404':
          description: TrainingRun does not exist in the authenticated scope
        '503':
          description: Workspace service credential is not configured
components:
  securitySchemes:
    WorkspaceServiceBearer:
      type: http
      scheme: bearer
      description: >-
        A dedicated high-entropy service credential whose SHA-256 digest is
        configured with one fixed organizationId and workspaceId on Yield.
  parameters:
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  schemas:
    WorkspaceArtifactProjection:
      type: object
      additionalProperties: false
      required: [digest, sizeBytes, kind]
      properties:
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [generic, model, dataset, checkpoint, training_spec, metrics, merged, quantized, report]
        manifestDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    WorkspaceDatasetVersionProjection:
      type: object
      additionalProperties: false
      required: [id, resourceVersion, artifact, format]
      properties:
        id:
          type: string
          format: uuid
        resourceVersion:
          type: integer
          minimum: 1
        artifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        validationArtifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        format:
          type: string
          enum: [ALPACA_JSONL]
    WorkspaceTrainingParameters:
      type: object
      additionalProperties: false
      required:
        - epochs
        - perDeviceBatchSize
        - gradientAccumulationSteps
        - learningRate
        - maxSequenceLength
        - loraRank
        - loraAlpha
        - loraDropout
        - template
      properties:
        epochs:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        perDeviceBatchSize:
          type: integer
          minimum: 1
          maximum: 64
        gradientAccumulationSteps:
          type: integer
          minimum: 1
          maximum: 1024
        learningRate:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        maxSequenceLength:
          type: integer
          minimum: 16
          maximum: 32768
        maxSteps:
          type: integer
          minimum: 1
        loraRank:
          type: integer
          minimum: 1
          maximum: 512
        loraAlpha:
          type: integer
          minimum: 1
        loraDropout:
          type: number
          minimum: 0
          maximum: 1
        template:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,100}$'
    WorkspaceBaseModelProjection:
      type: object
      additionalProperties: false
      required: [artifact, sourceRevision]
      properties:
        artifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        sourceRevision:
          type: string
          pattern: '^[0-9a-f]{40}$'
    WorkspaceTrainingConfigurationProjection:
      type: object
      additionalProperties: false
      required: [baseModel, parameters]
      properties:
        baseModel:
          $ref: '#/components/schemas/WorkspaceBaseModelProjection'
        parameters:
          $ref: '#/components/schemas/WorkspaceTrainingParameters'
    WorkspaceImportedParametersProjection:
      type: object
      additionalProperties: false
      required: [parameters]
      properties:
        parameters:
          $ref: '#/components/schemas/WorkspaceTrainingParameters'
    WorkspaceTrainingDraftProjection:
      type: object
      additionalProperties: false
      required: [id, state, name, resourceVersion, datasetVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [DRAFT, PREPARED, STARTED]
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^/\\:]{1,200}$'
        resourceVersion:
          type: integer
          minimum: 1
        datasetVersion:
          $ref: '#/components/schemas/WorkspaceDatasetVersionProjection'
        configuration:
          $ref: '#/components/schemas/WorkspaceTrainingConfigurationProjection'
        importedParameters:
          $ref: '#/components/schemas/WorkspaceImportedParametersProjection'
        trainingRunId:
          type: string
          format: uuid
        cancellationRequestedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    WorkspaceTrainingParameterProjection:
      type: object
      additionalProperties: false
      required:
        - epochs
        - perDeviceBatchSize
        - gradientAccumulationSteps
        - learningRate
        - maxSequenceLength
      properties:
        epochs:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        perDeviceBatchSize:
          type: integer
          minimum: 1
          maximum: 64
        gradientAccumulationSteps:
          type: integer
          minimum: 1
          maximum: 1024
        learningRate:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        maxSequenceLength:
          type: integer
          minimum: 16
          maximum: 32768
    WorkspaceTrainingSpecProjection:
      type: object
      additionalProperties: false
      required: [modelArtifact, datasetVersion, method, finetuningType, parameters]
      properties:
        modelArtifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        datasetVersion:
          $ref: '#/components/schemas/WorkspaceDatasetVersionProjection'
        method:
          type: string
          enum: [SFT]
        finetuningType:
          type: string
          enum: [LORA]
        parameters:
          $ref: '#/components/schemas/WorkspaceTrainingParameterProjection'
    WorkspaceProducedArtifactProjection:
      type: object
      additionalProperties: false
      required: [kind, artifact, derivedFromDigests]
      properties:
        kind:
          type: string
          enum: [MODEL_CHECKPOINT, MODEL_ADAPTER, METRICS, TRAINING_MANIFEST]
        artifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        derivedFromDigests:
          type: array
          items:
            type: string
            pattern: '^sha256:[0-9a-f]{64}$'
    WorkspaceTrainingFailureProjection:
      type: object
      additionalProperties: false
      required: [code, retryable]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{1,100}$'
        retryable:
          type: boolean
    WorkspaceTrainingResultProjection:
      type: object
      additionalProperties: false
      required: [id, adapterArtifact, checkpointArtifacts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        modelVersionDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        adapterArtifact:
          $ref: '#/components/schemas/WorkspaceArtifactProjection'
        checkpointArtifacts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceArtifactProjection'
        createdAt:
          type: string
          format: date-time
    WorkspaceTrainingRunProjection:
      type: object
      additionalProperties: false
      required:
        - id
        - draftId
        - state
        - spec
        - attemptCount
        - outputArtifacts
        - createdAt
        - updatedAt
        - resourceVersion
      properties:
        id:
          type: string
          format: uuid
        draftId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLING, CANCELLED, AWAITING_RETRY]
        spec:
          $ref: '#/components/schemas/WorkspaceTrainingSpecProjection'
        attemptCount:
          type: integer
          minimum: 0
        outputArtifacts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceProducedArtifactProjection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          minimum: 1
        cancellationRequestedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/WorkspaceTrainingResultProjection'
        failure:
          $ref: '#/components/schemas/WorkspaceTrainingFailureProjection'
    WorkspaceScopedTrainingRunProjection:
      type: object
      additionalProperties: false
      required: [id, draftId, state, spec, attemptCount, outputArtifacts, createdAt, updatedAt, resourceVersion, organizationId, workspaceId, trainingRunId]
      properties:
        id:
          type: string
          format: uuid
        draftId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLING, CANCELLED, AWAITING_RETRY]
        spec:
          $ref: '#/components/schemas/WorkspaceTrainingSpecProjection'
        attemptCount:
          type: integer
          minimum: 0
        outputArtifacts:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceProducedArtifactProjection'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          minimum: 1
        cancellationRequestedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/WorkspaceTrainingResultProjection'
        failure:
          $ref: '#/components/schemas/WorkspaceTrainingFailureProjection'
        organizationId:
          type: string
          minLength: 1
          maxLength: 200
        workspaceId:
          type: string
          minLength: 1
          maxLength: 200
        trainingRunId:
          type: string
          format: uuid
    WorkspaceTrainingEventsQuery:
      type: object
      additionalProperties: false
      required: [afterSequence, limit]
      properties:
        afterSequence:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
    WorkspaceTrainingCheckpointProjection:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
        step:
          type: integer
          minimum: 0
        epoch:
          type: number
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          minimum: 0
    WorkspaceTrainingEventProjection:
      type: object
      additionalProperties: false
      required: [sequence, trainingRunId, attemptId, phase, kind, message, timestamp]
      properties:
        sequence:
          type: integer
          minimum: 1
        trainingRunId:
          type: string
          format: uuid
        attemptId:
          type: string
          minLength: 1
          maxLength: 200
        phase:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          maxLength: 8192
        step:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        epoch:
          type: number
        loss:
          type: number
        learningRate:
          type: number
        throughput:
          type: number
        etaSeconds:
          type: number
        checkpoint:
          $ref: '#/components/schemas/WorkspaceTrainingCheckpointProjection'
        timestamp:
          type: string
          format: date-time
    WorkspaceTrainingEventsPageProjection:
      type: object
      additionalProperties: false
      required: [organizationId, workspaceId, trainingRunId, events, afterSequence, nextSequence, terminal, state]
      properties:
        organizationId:
          type: string
          minLength: 1
          maxLength: 200
        workspaceId:
          type: string
          minLength: 1
          maxLength: 200
        trainingRunId:
          type: string
          format: uuid
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/WorkspaceTrainingEventProjection'
        afterSequence:
          type: integer
          minimum: 0
        nextSequence:
          type: integer
          minimum: 0
        terminal:
          type: boolean
        state:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLING, CANCELLED, AWAITING_RETRY]
    WorkspaceTrainingAttemptsProjection:
      type: object
      additionalProperties: false
      required: [organizationId, workspaceId, trainingRunId, attempts]
      properties:
        organizationId:
          type: string
          minLength: 1
          maxLength: 200
        workspaceId:
          type: string
          minLength: 1
          maxLength: 200
        trainingRunId:
          type: string
          format: uuid
        attempts:
          type: array
          maxItems: 100
          items:
            $ref: ./openapi.yaml#/components/schemas/TrainingAttemptResource
