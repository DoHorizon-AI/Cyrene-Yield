schema_version: cyrene.repository-policy.v1
repository:
  logical_name: Cyrene-Yield
  lifecycle_class: PUBLIC_PRODUCT
  # Desired publication policy; live hosting visibility is verified separately.
  visibility: public
  source_owner: Cyrene Training Product Team
  remote_default_branch: main
  integration_branch: main
  release_branch: main
  default_branch: main
ownership:
  owns:
  - Model training product semantics & TrainingRun state
  - TrainingSpec compilation to ExecutionPlan
  - Epoch history, metric tracking & hyperparameter tuning
  does_not_own:
  - Generic OS process lifecycles or GPU cgroups
  - Concrete training engine internals
  - Generic dataset parsing, schema validation, or quality algorithms
  - Model analysis or generic compatibility-evaluation implementations
build:
  independent: true
  build_systems:
  - pyproject
artifacts:
  package_units:
  - cyrene-yield
  native_binaries: []
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - training
  - full
  standalone_user_product: true
integration:
  multi_repo_required: true
authorities:
  ci: github
  release: github_releases
  deployment: dohorizon_azure
trust:
  # The pinned Plugins revision is private until the dependency closure is published.
  public_requires_private: true
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: false
