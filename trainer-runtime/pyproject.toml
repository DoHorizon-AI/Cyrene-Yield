[project]
name = "cyrene-yield-trainer-runtime"
version = "0.1.0"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "grpcio==1.83.0",
    "protobuf==7.36.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
